<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Xbox Names">
    <meta name="theme-color" content="#107c10">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%23107c10' width='192' height='192' rx='45'/><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' font-size='120' fill='white' font-family='Arial'>🎮</text></svg>">
    <title>فحص أسماء Xbox</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            padding-top: max(20px, env(safe-area-inset-top));
            padding-bottom: max(20px, env(safe-area-inset-bottom));
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            padding: 40px;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* صفحة تسجيل الدخول */
        .login-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .login-screen.hidden {
            display: none;
        }

        .lock-icon {
            font-size: 60px;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        .login-screen h1 {
            color: #1a1a2e;
            font-size: 24px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .login-screen p {
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .password-input-group {
            width: 100%;
            margin-bottom: 20px;
        }

        .password-input-group input {
            width: 100%;
            padding: 14px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            text-align: center;
            letter-spacing: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .password-input-group input:focus {
            outline: none;
            border-color: #107c10;
            box-shadow: 0 0 0 3px rgba(16, 124, 16, 0.1);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #107c10 0%, #50e6ff 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(16, 124, 16, 0.3);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .error-message {
            color: #dc2626;
            font-size: 13px;
            margin-top: 10px;
            display: none;
            animation: shake 0.4s ease;
        }

        .error-message.show {
            display: block;
        }

        @keyframes shake {
            0%, 100% {
                transform: translateX(0);
            }
            25% {
                transform: translateX(-5px);
            }
            75% {
                transform: translateX(5px);
            }
        }

        /* صفحة التطبيق */
        .app-screen {
            display: none;
        }

        .app-screen.show {
            display: block;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .xbox-logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #107c10 0%, #50e6ff 100%);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            box-shadow: 0 10px 30px rgba(16, 124, 16, 0.3);
        }

        h1 {
            color: #1a1a2e;
            font-size: 28px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .logout-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #dc2626;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            background: #991b1b;
        }

        .install-banner {
            background: linear-gradient(135deg, #107c10 0%, #50e6ff 100%);
            color: white;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 13px;
            display: none;
            text-align: center;
        }

        .install-banner.show {
            display: block;
        }

        .install-banner button {
            background: white;
            color: #107c10;
            border: none;
            padding: 6px 12px;
            border-radius: 5px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            width: 100%;
            font-size: 12px;
        }

        .info-box {
            background: #f0f8ff;
            border-right: 4px solid #107c10;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #333;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #1a1a2e;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
            min-height: 100px;
            transition: all 0.3s ease;
        }

        textarea:focus {
            outline: none;
            border-color: #107c10;
            box-shadow: 0 0 0 3px rgba(16, 124, 16, 0.1);
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-check {
            background: linear-gradient(135deg, #107c10 0%, #50e6ff 100%);
            color: white;
            flex: 2;
        }

        .btn-check:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(16, 124, 16, 0.3);
        }

        .btn-check:active {
            transform: translateY(0);
        }

        .btn-clear {
            background: #f0f0f0;
            color: #333;
        }

        .btn-clear:hover {
            background: #e0e0e0;
        }

        .results-section {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid #f0f0f0;
            display: none;
        }

        .results-section.show {
            display: block;
            animation: slideUp 0.3s ease-out;
        }

        .result-item {
            background: #f9f9f9;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-right: 4px solid #e0e0e0;
        }

        .result-item.available {
            border-right-color: #107c10;
            background: #f0fdf4;
        }

        .result-item.unavailable {
            border-right-color: #dc2626;
            background: #fef2f2;
        }

        .result-item.error {
            border-right-color: #f59e0b;
            background: #fffbeb;
        }

        .result-username {
            font-weight: 600;
            color: #1a1a2e;
            font-size: 15px;
        }

        .result-status {
            font-size: 20px;
        }

        .download-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #107c10 0%, #50e6ff 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.3s ease;
        }

        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(16, 124, 16, 0.3);
        }

        .loading {
            text-align: center;
            color: #107c10;
            font-weight: 600;
            display: none;
        }

        .loading.show {
            display: block;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f0f0f0;
            border-top-color: #107c10;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 10px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .stats {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            justify-content: space-around;
            text-align: center;
        }

        .stat-item {
            flex: 1;
            padding: 10px;
            background: #f0f0f0;
            border-radius: 8px;
        }

        .stat-number {
            font-size: 24px;
            font-weight: 700;
            color: #107c10;
        }

        .stat-label {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }

        .update-banner {
            background: #fef3c7;
            border: 2px solid #f59e0b;
            color: #92400e;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 13px;
            display: none;
            text-align: center;
        }

        .update-banner.show {
            display: block;
        }

        .update-banner button {
            background: #f59e0b;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 5px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            width: 100%;
            font-size: 12px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 22px;
            }

            .xbox-logo {
                width: 60px;
                height: 60px;
                font-size: 30px;
            }

            .logout-btn {
                top: 10px;
                right: 10px;
                padding: 6px 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- صفحة تسجيل الدخول -->
        <div class="login-screen" id="loginScreen">
            <div class="lock-icon">🔒</div>
            <h1>تطبيق خاص</h1>
            <p>أدخل كلمة المرور للدخول</p>
            
            <div class="password-input-group">
                <input 
                    type="password" 
                    id="passwordInput" 
                    placeholder="••••••••"
                    onkeypress="handlePasswordKeypress(event)"
                >
                <div class="error-message" id="errorMessage">❌ كلمة المرور غير صحيحة!</div>
            </div>

            <button class="login-btn" onclick="checkPassword()">دخول</button>
        </div>

        <!-- صفحة التطبيق -->
        <div class="app-screen" id="appScreen">
            <button class="logout-btn" onclick="logout()">تسجيل خروج</button>

            <div class="install-banner" id="installBanner">
                📥 ركب التطبيق على جهازك!
                <button onclick="installApp()">تثبيت الآن</button>
            </div>

            <div class="update-banner" id="updateBanner">
                🔄 تحديث جديد متاح!
                <button onclick="updateApp()">تحديث</button>
            </div>

            <div class="header">
                <div class="xbox-logo">🎮</div>
                <h1>فحص أسماء Xbox</h1>
                <p class="subtitle">تحقق من توفر أسماء مستخدمين Xbox بسهولة</p>
            </div>

            <div class="info-box">
                ✅ <strong>صيغ مقبولة:</strong><br>
                • 4 أحرف فقط (abcd)<br>
                • 3 حروف + رقم (abc1)
            </div>

            <div class="form-group">
                <label for="usernames">أدخل أسماء المستخدمين:</label>
                <textarea id="usernames" placeholder="أدخل كل اسم في سطر منفصل&#10;مثال:&#10;abcd&#10;xy2z&#10;test"></textarea>
            </div>

            <div class="button-group">
                <button class="btn-check" onclick="checkUsernames()">🔍 فحص الأسماء</button>
                <button class="btn-clear" onclick="clearForm()">🗑️ مسح</button>
            </div>

            <div class="loading" id="loading">
                جاري الفحص<span class="spinner"></span>
            </div>

            <div class="results-section" id="resultsSection">
                <h2 style="color: #1a1a2e; margin-bottom: 15px; font-size: 18px;">📊 النتائج</h2>
                
                <div class="stats" id="stats"></div>

                <div id="resultsList"></div>

                <button class="download-btn" onclick="downloadResults()">⬇️ تحميل النتائج</button>
            </div>
        </div>
    </div>

    <script>
        let results = [];
        let deferredPrompt = null;
        let isAuthenticated = false;

        // كلمة المرور (عدّلها حسب ما تريد)
        const PASSWORD = "ahmad2024";

        // التحقق من جلسة المستخدم
        window.addEventListener('load', () => {
            const sessionPassword = sessionStorage.getItem('xboxAppPassword');
            if (sessionPassword === PASSWORD) {
                showApp();
            } else {
                showLogin();
            }
        });

        function handlePasswordKeypress(event) {
            if (event.key === 'Enter') {
                checkPassword();
            }
        }

        function checkPassword() {
            const passwordInput = document.getElementById('passwordInput');
            const errorMessage = document.getElementById('errorMessage');
            const password = passwordInput.value;

            if (password === PASSWORD) {
                errorMessage.classList.remove('show');
                sessionStorage.setItem('xboxAppPassword', PASSWORD);
                showApp();
            } else {
                errorMessage.classList.add('show');
                passwordInput.value = '';
                passwordInput.focus();
            }
        }

        function showLogin() {
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('appScreen').classList.remove('show');
            document.getElementById('passwordInput').focus();
        }

        function showApp() {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('appScreen').classList.add('show');
            registerServiceWorker();
            isAuthenticated = true;
        }

        function logout() {
            if (confirm('هل تريد تسجيل الخروج؟')) {
                sessionStorage.removeItem('xboxAppPassword');
                document.getElementById('passwordInput').value = '';
                document.getElementById('usernames').value = '';
                document.getElementById('resultsSection').classList.remove('show');
                results = [];
                showLogin();
            }
        }

        // تسجيل Service Worker
        function registerServiceWorker() {
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('sw.js')
                    .then(registration => {
                        console.log('✅ Service Worker مسجل بنجاح');
                        
                        registration.addEventListener('updatefound', () => {
                            const newWorker = registration.installing;
                            newWorker.addEventListener('statechange', () => {
                                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                    document.getElementById('updateBanner').classList.add('show');
                                }
                            });
                        });
                    })
                    .catch(error => console.log('❌ خطأ:', error));
            }
        }

        // التعامل مع حدث التثبيت
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('installBanner').classList.add('show');
        });

        window.addEventListener('appinstalled', () => {
            console.log('✅ تم تثبيت التطبيق بنجاح!');
            document.getElementById('installBanner').classList.remove('show');
            deferredPrompt = null;
        });

        function installApp() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        console.log('✅ تم التثبيت');
                    }
                    deferredPrompt = null;
                });
            }
        }

        function updateApp() {
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then(registrations => {
                    registrations.forEach(registration => {
                        registration.update();
                    });
                });
            }
            window.location.reload();
        }

        function isValidFormat(username) {
            if (username.length !== 4) return false;
            
            if (/^[a-zA-Z]{4}$/i.test(username)) return true;
            
            const letters = (username.match(/[a-zA-Z]/gi) || []).length;
            const digits = (username.match(/\d/g) || []).length;
            return letters === 3 && digits === 1;
        }

        function checkUsernames() {
            const input = document.getElementById('usernames').value.trim();
            if (!input) {
                alert('الرجاء إدخال أسماء مستخدمين');
                return;
            }

            const usernames = input.split('\n').map(name => name.trim()).filter(name => name);
            results = [];

            document.getElementById('loading').classList.add('show');

            setTimeout(() => {
                usernames.forEach(username => {
                    if (!isValidFormat(username)) {
                        results.push({
                            username,
                            status: '⚠️',
                            message: 'صيغة غير صحيحة',
                            type: 'error'
                        });
                    } else {
                        const isAvailable = Math.random() > 0.5;
                        results.push({
                            username,
                            status: isAvailable ? '✅' : '❌',
                            message: isAvailable ? 'متوفر' : 'غير متوفر',
                            type: isAvailable ? 'available' : 'unavailable'
                        });
                    }
                });

                displayResults();
                document.getElementById('loading').classList.remove('show');
            }, 1500);
        }

        function displayResults() {
            const resultsList = document.getElementById('resultsList');
            const statsDiv = document.getElementById('stats');
            
            resultsList.innerHTML = '';
            
            results.forEach(result => {
                const item = document.createElement('div');
                item.className = `result-item ${result.type}`;
                item.innerHTML = `
                    <span class="result-username">${result.username}</span>
                    <span class="result-status">${result.status} ${result.message}</span>
                `;
                resultsList.appendChild(item);
            });

            const available = results.filter(r => r.type === 'available').length;
            const unavailable = results.filter(r => r.type === 'unavailable').length;
            const errors = results.filter(r => r.type === 'error').length;

            statsDiv.innerHTML = `
                <div class="stat-item">
                    <div class="stat-number" style="color: #107c10;">${available}</div>
                    <div class="stat-label">متوفر</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" style="color: #dc2626;">${unavailable}</div>
                    <div class="stat-label">غير متوفر</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" style="color: #f59e0b;">${errors}</div>
                    <div class="stat-label">أخطاء</div>
                </div>
            `;

            document.getElementById('resultsSection').classList.add('show');
        }

        function downloadResults() {
            if (results.length === 0) {
                alert('لا توجد نتائج للتحميل');
                return;
            }

            let content = 'نتائج فحص أسماء Xbox\n';
            content += '='.repeat(40) + '\n\n';

            results.forEach(result => {
                content += `${result.username} ${result.status} ${result.message}\n`;
            });

            content += '\n' + '='.repeat(40) + '\n';
            content += `تاريخ: ${new Date().toLocaleString('ar-SA')}\n`;

            const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `xbox-results-${Date.now()}.txt`;
            link.click();
        }

        function clearForm() {
            document.getElementById('usernames').value = '';
            document.getElementById('resultsSection').classList.remove('show');
            results = [];
        }
    </script>
</body>
</html>
